<!DOCTYPE html>
<html>
<head>
    <title>Delete Job</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .delete-card {
            max-width: 600px;
            margin: auto;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card shadow-lg border-0 delete-card">
        <div class="card-body text-center p-5">

            <!-- Warning Icon -->
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 60px;"></i>
            </div>

            <!-- Heading -->
            <h3 class="mb-3 text-danger">Confirm Deletion</h3>

            <!-- Message -->
            <p class="fs-5">
                Are you sure you want to delete:
                <strong>"{{ object.title }}"</strong>?
            </p>

            <p class="text-muted">
                This action cannot be undone.
            </p>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-3 mt-4">

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                </form>

                <a href="{% url 'job_detail' object.pk %}" class="btn btn-outline-secondary btn-lg">
                    Cancel
                </a>

            </div>

        </div>
    </div>

</div>

</body>
</html>
