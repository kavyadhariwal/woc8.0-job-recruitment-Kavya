{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CareerHome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff; /* White background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 1rem;
            max-width: 400px;
            width: 100%;
        }

        .card-header {
            background: #2575fc;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1.5rem;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-control {
            border-radius: 0.5rem;
        }

        .btn-primary {
            background: #2575fc;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #1a5dc9;
        }

        .forgot-password {
            font-size: 0.85rem;
        }

        .register-link {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">

            <div class="card shadow-lg">
                
                <div class="card-header">
                    Login
                </div>

                <div class="card-body">

                    <p class="text-center text-muted mb-4">
                        Welcome back! Please login to your account
                    </p>

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                Login
                            </button>
                        </div>

                        <!-- Forgot Password -->
                        <div class="text-center mb-3">
                            <a href="{% url 'password_reset' %}" class="forgot-password text-decoration-none text-primary">
                                Forgot password?
                            </a>
                        </div>

                        <!-- Register -->
                        <div class="text-center register-link">
                            Don't have an account? 
                            <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none text-primary">Sign Up</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
